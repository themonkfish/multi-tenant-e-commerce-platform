name: Supabase migrations

on:
  pull_request:
    paths:
      - "front-end/supabase/**"
      - ".github/workflows/supabase-migrations.yml"
  push:
    paths:
      - "front-end/supabase/**"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-migrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Apply and lint platform migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-end
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: v2.stable

      - name: Start a clean local database and apply all migrations
        run: supabase db start

      - name: Lint migrated database schema
        run: supabase db lint --local --fail-on error
