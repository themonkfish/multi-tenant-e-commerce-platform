name: Platform store restore drill

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-store-restore-drill
  cancel-in-progress: false

jobs:
  restore-drill:
    name: Verify backup and restore drill
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run guarded backup and restore drill tests
        working-directory: front-end
        run: npm run test:platform-backup
