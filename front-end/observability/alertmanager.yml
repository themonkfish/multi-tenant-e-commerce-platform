global:
  resolve_timeout: 5m

route:
  receiver: ecommerce-default
  group_by: ["alertname", "tenant_id", "host_id"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: ecommerce-default
    # Replace this placeholder with a real webhook, email, PagerDuty, or Slack receiver.
    webhook_configs:
      - url: "https://alerts.example.com/ecommerce"
        send_resolved: true
