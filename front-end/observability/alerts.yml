groups:
  - name: ecommerce-availability
    rules:
      - alert: EcommerceMetricsTargetDown
        expr: up{job="multi_tenant_ecommerce"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "E-commerce metrics target is unreachable"
          runbook: "https://ecommerce.example.com/docs/observability#runbooks"

      - alert: EcommerceHighWebhookFailureRate
        expr: |
          (
            sum(increase(ecommerce_event_total{event=~"stripe_order_sync_failed|carrier_webhook_sync_failed"}[10m]))
            /
            clamp_min(
              sum(increase(ecommerce_event_total{event=~"stripe_webhook_paid|stripe_order_sync_failed|carrier_webhook_processed|carrier_webhook_sync_failed"}[10m])),
              1
            )
          ) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Stripe or carrier order synchronization failures exceed 5%"

      - alert: EcommerceWebhookSignatureRejections
        expr: increase(ecommerce_event_total{event=~"stripe_webhook_invalid_signature|carrier_webhook_invalid_signature"}[10m]) > 20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Webhook signature rejections are elevated"
          runbook: "https://ecommerce.example.com/docs/observability#runbooks"

      - alert: EcommerceTenantWebhookSyncFailure
        expr: |
          increase(ecommerce_scoped_event_total{event="carrier_webhook_sync_failed"}[10m]) > 5
          or
          increase(ecommerce_scoped_event_total{event="stripe_order_sync_failed"}[10m]) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Tenant webhook synchronization failures exceeded 5 in 10 minutes"
          runbook: "https://ecommerce.example.com/docs/observability#runbooks"

      - alert: EcommerceDistributedRateLimitRejected
        expr: increase(ecommerce_event_total{event="rate_limit_distributed_rejected"}[10m]) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Distributed rate limiter is rejecting elevated traffic"
          runbook: "https://ecommerce.example.com/docs/observability#runbooks"

      - alert: EcommerceDistributedRateLimitUnavailable
        expr: increase(ecommerce_event_total{event="rate_limit_distributed_error"}[10m]) > 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Distributed rate limiter provider is unavailable"
          runbook: "https://ecommerce.example.com/docs/observability#runbooks"

      - alert: EcommerceMetricsScrapeUnauthorized
        expr: increase(ecommerce_event_total{event="metrics_scrape_unauthorized"}[10m]) > 20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Unauthorized metrics scrape attempts are elevated"
          runbook: "https://ecommerce.example.com/docs/observability#runbooks"
